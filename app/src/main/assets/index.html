<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#161b18">
  <title>New War</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="prestart">
  <canvas id="game"></canvas>
  <div id="look-pad"></div>
  <div id="crosshair"><i></i><b></b></div>
  <div id="stick" class="control">
    <div id="stick-knob"></div>
  </div>
  <div id="buttons" class="control">
    <button id="fire" class="fire" aria-label="Ateş">●</button>
    <button id="aim" aria-label="Nişan">⌖</button>
    <button id="jump" aria-label="Zıpla">↑</button>
    <button id="prone" aria-label="Yat">↓</button>
    <button id="weapon" aria-label="Silah değiştir">⇄</button>
    <button id="camera-mode" aria-label="Kamera görünümünü değiştir">◉</button>
  </div>
  <div id="loading">3D karakter ve animasyonlar yukleniyor...</div>
  <div id="start-screen" class="hidden">
    <div class="start-card">
      <strong>NEW WAR</strong>
      <span>EGITIM SAHASINA HAZIRSIN</span>
      <button id="continue">DEVAM ET</button>
    </div>
  </div>
  <script src="game.bundle.js"></script>
</body>
</html>
