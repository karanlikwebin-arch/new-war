plugins {
    id "com.android.application"
}

android {
    namespace "com.newwar.prototype"
    compileSdk 36

    defaultConfig {
        applicationId "com.newwar.prototype"
        minSdk 23
        targetSdk 36
        versionCode 7
        versionName "0.7"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
        }
    }

    dependencies {
        implementation "androidx.webkit:webkit:1.12.1"
    }
}
